name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false
        default: latest

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/templater-backend

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest
          build-args: |
            VITE_ONLYOFFICE_URL=${{ vars.VITE_ONLYOFFICE_URL || secrets.VITE_ONLYOFFICE_URL }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Write compose env
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          JWTSecret: ${{ secrets.JWTSecret }}
          OnlyOfficeJWTSecret: ${{ secrets.OnlyOfficeJWTSecret }}
          PublicBaseURL: ${{ vars.PublicBaseURL || secrets.PublicBaseURL }}
          OnlyOfficeURL: ${{ vars.OnlyOfficeURL || secrets.OnlyOfficeURL }}
          CORSOrigins: ${{ vars.CORSOrigins || secrets.CORSOrigins }}
          HTTP_PORT: ${{ vars.HTTP_PORT || secrets.HTTP_PORT }}
        run: |
          if [ -z "$JWTSecret" ] || [ -z "$OnlyOfficeJWTSecret" ]; then
            echo "JWTSecret or OnlyOfficeJWTSecret is empty (check Repository secrets, not Environment)"
            exit 1
          fi
          umask 077
          {
            echo "GHCR_IMAGE=${GHCR_IMAGE}"
            echo "IMAGE_TAG=${IMAGE_TAG}"
            echo "JWTSecret=${JWTSecret}"
            echo "OnlyOfficeJWTSecret=${OnlyOfficeJWTSecret}"
            echo "PublicBaseURL=${PublicBaseURL}"
            echo "OnlyOfficeURL=${OnlyOfficeURL}"
            echo "CORSOrigins=${CORSOrigins}"
            echo "HTTP_PORT=${HTTP_PORT}"
          } > deploy.env
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PROD_HOST || secrets.PROD_HOST }}
          username: ${{ vars.PROD_USER || secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          source: docker-compose.yml,nginx/nginx.conf,deploy.env
          target: /home/${{ vars.PROD_USER || secrets.PROD_USER }}/templater
      - uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.PROD_HOST || secrets.PROD_HOST }}
          username: ${{ vars.PROD_USER || secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT || '22' }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ~/templater
            cd ~/templater
            mv -f deploy.env .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans --force-recreate
