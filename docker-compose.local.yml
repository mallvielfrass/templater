version: "3.7"
services:
  templater-backend:
    build: .
    image: templater-backend
    ports:
      - "3053:3053"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - templater-backend-data:/storage
    environment:
      HttpPort: "3053"
      BadgerDBPath: /storage/badger
      JWTSecret: dev-jwt-secret-change-me
      PublicBaseURL: http://templater-backend:3053
      OnlyOfficeJWTSecret: onlyoffice-dev-secret
      OnlyOfficeURL: http://onlyoffice
    networks:
      templater-backend-network:
        aliases:
          - templater-backend

  onlyoffice:
    build:
      context: .
      dockerfile: Dockerfile.onlyoffice
    image: templater-onlyoffice
    container_name: templater-onlyoffice
    ports:
      - "8080:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: onlyoffice-dev-secret
      JWT_HEADER: Authorization
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      templater-backend-network:
        aliases:
          - onlyoffice
          - documentserver

volumes:
  templater-backend-data:

networks:
  templater-backend-network:
